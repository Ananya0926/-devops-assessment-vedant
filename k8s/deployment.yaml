apiVersion: apps/v1
kind: Deployment
metadata:
  name: assessment-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: assessment-app
  template:
    metadata:
      labels:
        app: assessment-app
    spec:
      containers:
        - name: app
          image: 637560253747.dkr.ecr.us-east-1.amazonaws.com/devops-assessment-vedant:2a4d03fa66f4100c693526e6110c541540d80d5a
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
